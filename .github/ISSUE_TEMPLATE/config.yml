# Blank issues stay ON deliberately, though no longer for the reason this
# comment used to give.
#
# It said the app's support button opens /issues/new?title=…&body=…&labels=…
# because GitHub honours a prefilled *body* only on the blank form. The first
# half of that is now out of date and the second half is still true and was
# never the whole story: a form ignores `body`, but it does read one query
# parameter per field, keyed by the field's `id` in the YAML. So "Report a bug"
# now opens bug_report.yml with the version, the platform, the OS and the
# diagnostics already filled in — see `lib/src/about/bug_report.dart`, which
# owns those ids and must be kept in step with this directory by hand.
#
# Blank issues stay on anyway. Nothing about a form makes them harmful, and
# turning them off would take away the one route that needs no template to fit.
blank_issues_enabled: true

contact_links:
  - name: Ask a question, or show what you made
    url: https://github.com/WilliamKarolDiCioccio/ripple_effect_support/discussions
    about: Usage, ideas, and anything that is not yet a bug.

  - name: Something wrong with the node canvas itself
    url: https://github.com/WilliamKarolDiCioccio/fl_nodes_v2/issues
    about: Panning, wiring, selection and undo live in fl_nodes_v2, which is a public package of its own.
